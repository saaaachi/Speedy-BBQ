<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #333; }
        .ad-container { width: 320px; height: 100px; } /* 広告サイズに合わせて調整 */
    </style>
</head>
<body>
    <div class="ad-container" id="ad-slot">
        </div>

    <script>
        // URLのパラメータ (?pos=top など) を読み取る
        const urlParams = new URLSearchParams(window.location.search);
        const position = urlParams.get('pos');
        const adSlot = document.getElementById('ad-slot');

        if (position === 'top') {
            // 【上用】の広告タグをここに書き込む
            adSlot.innerHTML = `
                <script src="https://adm.shinobi.jp/s/上の広告ID"></script>
            `;
        } else if (position === 'bottom') {
            // 【下用】の広告タグをここに書き込む
            adSlot.innerHTML = `
                <script src="https://adm.shinobi.jp/s/下の広告ID"></script>
            `;
        } else {
            // どちらでもない場合（予備）
            adSlot.innerHTML = `
                <script src="https://adm.shinobi.jp/s/予備の広告ID"></script>
            `;
        }
    </script>
</body>
</html>
